<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RASOAT Survey Platform</title><style>
:root{--p:#1769aa;--d:#b42318;--bg:#f3f6fa;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#172033}.hidden{display:none!important}button{border:0;border-radius:9px;padding:10px 14px;background:var(--p);color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#667085}button.danger{background:var(--d)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:90px}label{display:block;font-weight:bold;margin:8px 0}.app{display:flex;min-height:100vh}.side{width:225px;background:#102f49;color:#fff;padding:15px;position:fixed;height:100vh}.main{margin-left:225px;padding:18px;width:calc(100% - 225px)}.nav button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}.nav button.active{background:#175072}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 5px 22px #102a4310}.login{max-width:620px;margin:6vh auto}.hero{background:linear-gradient(135deg,#1769aa,#123e68);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:25px;display:block}.table{overflow:auto}.table table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.table th{background:#f7f9fb}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar>*{width:auto}.qcard,.rule{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.qgrid{display:grid;grid-template-columns:1fr 2fr 1fr 80px 70px;gap:8px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.modal>div{background:white;border-radius:15px;padding:18px;width:min(900px,100%);max-height:90vh;overflow:auto}.err{color:var(--d);min-height:20px}.muted{color:#667085}.question{border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}.section{font-size:17px;font-weight:bold;margin-top:20px}.option{font-weight:normal}.option input{width:auto;margin-right:6px}@media(max-width:800px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:10px}.grid,.qgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="public" class="login"><div class="card hero"><h1 id="pt">Khảo sát</h1><div id="pd"></div></div><div id="loginBox" class="card"><h2>Đăng nhập nhân viên</h2><label>CCCD</label><input id="cccd" inputmode="numeric" maxlength="12"><div id="le" class="err"></div><button onclick="loginEmp()">Tiếp tục</button> <button class="secondary" onclick="openAdmin()">Admin</button></div><div id="consentBox" class="card hidden"><div id="eb" class="card"></div><div id="welcome"></div><label class="option"><input id="agree" type="checkbox"> Tôi đồng ý với nội dung khảo sát.</label><div id="ce" class="err"></div><button onclick="start()">Bắt đầu</button> <button class="secondary" onclick="logoutEmp()">Thoát</button></div><div id="formBox" class="card hidden"><div id="fh"></div><div id="fb"></div><div id="fe" class="err"></div><button onclick="submit()">Gửi khảo sát</button></div></div>
<div id="admin" class="app hidden"><aside class="side"><h2>RASOAT STUDIO</h2><div id="who" class="muted"></div><hr><div class="nav"><button data-t="dashboard" onclick="tab('dashboard')">📊 Dashboard</button><button data-t="surveys" onclick="tab('surveys')">🗂 Surveys</button><button data-t="builder" onclick="tab('builder')">🧩 Form Builder</button><button data-t="logic" onclick="tab('logic')">🔀 Logic</button><button data-t="responses" onclick="tab('responses')">👥 Responses</button><button data-t="bank" onclick="tab('bank')">📚 Question Bank</button><button data-t="settings" onclick="tab('settings')">⚙ Settings</button></div><button class="secondary" style="width:100%;margin-top:15px" onclick="logoutAdmin()">Đăng xuất</button></aside><main class="main"><div class="toolbar"><select id="surveySel" onchange="choose(this.value)"></select></div><div id="tabs"><div id="dashboard"></div><div id="surveys" class="hidden"></div><div id="builder" class="hidden"></div><div id="logic" class="hidden"></div><div id="responses" class="hidden"></div><div id="bank" class="hidden"></div><div id="settings" class="hidden"></div></div></main></div><div id="modal" class="modal hidden"><div><div class="toolbar" style="justify-content:space-between"><h3 id="mt"></h3><button class="secondary" onclick="closeM()">Đóng</button></div><div id="mb"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxKc5ALg1JC80voUs2gVYeJ_VIsK-EVrf0WRn3wKHozSYglY3PlNghVmYwvyjNodGk/exec';const CODE=new URLSearchParams(location.search).get('survey')||'KSTT_2026';let P={token:'',survey:null,questions:[],sections:[],rules:[],answers:{},emp:null},A={token:localStorage.rasoatAdminToken||'',user:null,surveys:[],cur:null,full:null,types:[]};const $=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(action,p={}){let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...p})});return r.json()}function pub(x){['loginBox','consentBox','formBox'].forEach(i=>$(i).classList.toggle('hidden',i!==x))}async function boot(){let d=await api('getPublicSurvey',{code:CODE});if(!d.ok)return $('le').textContent=d.message;Object.assign(P,{survey:d.survey,questions:d.questions,sections:d.sections,rules:d.rules});$('pt').textContent=d.survey.Title;$('pd').textContent=d.survey.Description||''}async function loginEmp(){let d=await api('employeeLogin',{code:CODE,cccd:$('cccd').value});if(!d.ok)return $('le').textContent=d.message;Object.assign(P,{token:d.token,emp:d.employee,survey:d.survey,questions:d.questions,sections:d.sections,rules:d.rules,answers:d.answers||{}});$('eb').innerHTML='<b>'+E(d.employee.hoTen)+'</b><br>Mã NV: '+E(d.employee.maNV)+'<br>CCCD: '+E(d.employee.cccd);$('welcome').textContent=d.survey.WelcomeText||'';pub('consentBox')}function start(){if(!$('agree').checked)return $('ce').textContent='Vui lòng xác nhận đồng ý.';renderForm();pub('formBox')}function renderForm(){let h='',last='';P.questions.forEach(q=>{if(q.SectionId!==last){last=q.SectionId;let s=P.sections.find(x=>x.SectionId===q.SectionId);h+='<div class="section">'+E(s?s.Title:'')+'</div>'}h+='<div class="question" data-q="'+E(q.QuestionId)+'"><label>'+E(q.Label)+(q.Required?' *':'')+'</label>'+control(q)+'</div>'});$('fh').innerHTML='<h2>'+E(P.survey.Title)+'</h2>';$('fb').innerHTML=h}function control(q){let id='q_'+q.QuestionId,v=P.answers[q.QuestionId],o=q.Options||[];if(q.Type==='textarea')return '<textarea id="'+id+'">'+E(v||'')+'</textarea>';if(['date','datetime','number','email','phone'].includes(q.Type))return '<input id="'+id+'" type="'+q.Type+'" value="'+E(v||'')+'">';if(q.Type==='select')return '<select id="'+id+'"><option value="">-- Chọn --</option>'+o.map(x=>'<option value="'+E(x.Value)+'" '+(v===x.Value?'selected':'')+'>'+E(x.Label)+'</option>').join('')+'</select>';if(['radio','yesno','likert5'].includes(q.Type)){let z=q.Type==='yesno'?[{Value:'Có',Label:'Có'},{Value:'Không',Label:'Không'}]:q.Type==='likert5'?['Rất không đồng ý','Không đồng ý','Trung lập','Đồng ý','Rất đồng ý'].map(x=>({Value:x,Label:x})):o;return z.map(x=>'<label class="option"><input type="radio" data-q="'+q.QuestionId+'" name="'+id+'" value="'+E(x.Value)+'" '+(v===x.Value?'checked':'')+'> '+E(x.Label)+'</label>').join('')}if(['multiselect','checkbox'].includes(q.Type)){let z=Array.isArray(v)?v:[];return o.map(x=>'<label class="option"><input type="checkbox" data-q="'+q.QuestionId+'" value="'+E(x.Value)+'" '+(z.includes(x.Value)?'checked':'')+'> '+E(x.Label)+'</label>').join('')}if(['rating5','rating10'].includes(q.Type)){let n=q.Type==='rating5'?5:10;return '<select id="'+id+'"><option value="">-- Chọn --</option>'+Array.from({length:n},(_,i)=>'<option '+(String(v||'')==String(i+1)?'selected':'')+'>'+String(i+1)+'</option>').join('')+'</select>'}return '<input id="'+id+'" value="'+E(v||'')+'" placeholder="'+E(q.Placeholder||'')+'">'}function collect(){let a={};P.questions.forEach(q=>{let id='q_'+q.QuestionId;if(['multiselect','checkbox'].includes(q.Type))a[q.QuestionId]=[...document.querySelectorAll('input[data-q="'+CSS.escape(q.QuestionId)+'"]:checked')].map(x=>x.value);else if(['radio','yesno','likert5'].includes(q.Type)){let x=document.querySelector('input[data-q="'+CSS.escape(q.QuestionId)+'"]:checked');a[q.QuestionId]=x?x.value:''}else a[q.QuestionId]=$(id)?.value||''});return a}async function submit(){let d=await api('saveResponse',{token:P.token,answers:collect(),consent:true});if(!d.ok)return $('fe').textContent=d.message;alert(d.message);logoutEmp()}function logoutEmp(){P.token='';pub('loginBox')}
function openAdmin(){$('public').classList.add('hidden');$('admin').classList.remove('hidden');if(A.token)startAdmin();else loginAdminBox()}function loginAdminBox(){openM('Admin','<label>Tài khoản</label><input id="mu" value="admin"><label>Mật khẩu</label><input id="mp" type="password"><div id="me" class="err"></div><button onclick="doLogin()">Đăng nhập</button>')}async function doLogin(){let d=await api('adminLogin',{username:$('mu').value,password:$('mp').value});if(!d.ok)return $('me').textContent=d.message;A.token=d.token;A.user=d.user;localStorage.rasoatAdminToken=A.token;closeM();startAdmin()}async function startAdmin(){let d=await api('adminBootstrap',{token:A.token});if(!d.ok){A.token='';localStorage.removeItem('rasoatAdminToken');return loginAdminBox()}A.user=d.user;A.surveys=d.surveys;A.types=d.questionTypes;A.cur=A.surveys.find(x=>x.Code===CODE)||A.surveys[0];$('who').textContent=A.user.username+' · '+A.user.role;drawSel();tab('dashboard')}function drawSel(){$('surveySel').innerHTML=A.surveys.map(s=>'<option value="'+E(s.Code)+'" '+(A.cur&&s.Code===A.cur.Code?'selected':'')+'>'+E(s.Code)+' — '+E(s.Name)+'</option>').join('')}async function choose(c){A.cur=A.surveys.find(x=>x.Code===c)||A.cur;tab('dashboard')}async function tab(n){document.querySelectorAll('#tabs>div').forEach(x=>x.classList.add('hidden'));$(n).classList.remove('hidden');if(n==='dashboard')dash();if(n==='surveys')surveys();if(n==='builder')builder();if(n==='logic')logic();if(n==='responses')responses();if(n==='bank')bank();if(n==='settings')settings()}
async function dash(){let d=await api('adminDashboard',{token:A.token,code:A.cur.Code});if(!d.ok)return alert(d.message);let s=d.summary;$('dashboard').innerHTML='<div class="stats"><div class="stat">Tổng<b>'+s.total+'</b></div><div class="stat">Hoàn tất<b>'+s.completed+'</b></div><div class="stat">Đang làm<b>'+s.inProgress+'</b></div><div class="stat">Chưa bắt đầu<b>'+s.notStarted+'</b></div></div><div class="card"><button onclick="downloadCsv()">⬇ CSV</button><div class="table"><table><tr><th>Mã NV</th><th>Họ tên</th><th>CCCD</th><th>Status</th><th>Cập nhật</th></tr>'+d.rows.map(r=>'<tr><td>'+E(r.maNV)+'</td><td>'+E(r.hoTen)+'</td><td>'+E(r.cccd)+'</td><td>'+E(r.status)+'</td><td>'+E(r.updatedAt)+'</td></tr>').join('')+'</table></div></div>'}
function surveys(){$('surveys').innerHTML='<div class="card"><button onclick="newSurvey()">＋ Tạo khảo sát</button><div class="table"><table><tr><th>Mã</th><th>Tên</th><th>Status</th><th>Version</th><th></th></tr>'+A.surveys.map(s=>'<tr><td>'+E(s.Code)+'</td><td>'+E(s.Name)+'</td><td>'+E(s.Status)+'</td><td>'+E(s.Version)+'</td><td><button onclick="editSurvey(\''+E(s.Code)+'\')">Sửa</button> <button class="secondary" onclick="clone(\''+E(s.Code)+'\')">Clone</button></td></tr>').join('')+'</table></div></div>'}async function editSurvey(c){let d=await api('adminGetSurvey',{token:A.token,code:c}),s=d.survey;openM('Chỉnh sửa','<div class="grid"><div><label>Tên</label><input id="sn" value="'+E(s.Name)+'"></div><div><label>Tiêu đề</label><input id="st" value="'+E(s.Title)+'"></div><div class="full"><label>Mô tả</label><textarea id="sd">'+E(s.Description)+'</textarea></div><div class="full"><label>Welcome</label><textarea id="sw">'+E(s.WelcomeText)+'</textarea></div><div class="full"><label>Consent</label><textarea id="sc">'+E(s.ConsentText)+'</textarea></div><div><label>Start</label><input id="ss" type="datetime-local" value="'+local(s.StartAt)+'"></div><div><label>End</label><input id="se" type="datetime-local" value="'+local(s.EndAt)+'"></div></div><button onclick="saveS(\''+E(c)+'\')">Lưu</button> <button onclick="status(\''+E(c)+'\',\'PUBLISHED\')">Mở</button> <button class="danger" onclick="status(\''+E(c)+'\',\'CLOSED\')">Đóng</button>')}function local(x){if(!x)return'';let d=new Date(x);return isNaN(d)?'':new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}async function saveS(c){let d=await api('adminSaveSurvey',{token:A.token,code:c,patch:{Name:$('sn').value,Title:$('st').value,Description:$('sd').value,WelcomeText:$('sw').value,ConsentText:$('sc').value,StartAt:$('ss').value,EndAt:$('se').value}});if(d.ok){closeM();refresh()}else alert(d.message)}async function status(c,s){let d=await api('adminSetSurveyStatus',{token:A.token,code:c,status:s});if(d.ok){closeM();refresh()}else alert(d.message)}function newSurvey(){openM('Tạo khảo sát','<div class="grid"><input id="nc" placeholder="HSE_2026"><input id="nn" placeholder="Tên"><input id="nt" class="full" placeholder="Tiêu đề"><textarea id="nd" class="full" placeholder="Mô tả"></textarea></div><button onclick="createS()">Tạo</button>')}async function createS(){let d=await api('adminCreateSurvey',{token:A.token,survey:{Code:$('nc').value,Name:$('nn').value,Title:$('nt').value,Description:$('nd').value}});if(d.ok){closeM();refresh()}else alert(d.message)}async function clone(c){let n=prompt('Mã mới',c+'_COPY');if(!n)return;let d=await api('adminCloneSurvey',{token:A.token,sourceCode:c,newCode:n});if(d.ok)refresh();else alert(d.message)}async function refresh(){let d=await api('adminBootstrap',{token:A.token});if(d.ok){A.surveys=d.surveys;drawSel();A.cur=A.surveys.find(x=>x.Code===A.cur.Code)||A.surveys[0];surveys()}}
async function builder(){let d=await api('adminGetSurvey',{token:A.token,code:A.cur.Code});A.full=d;let h='<div class="card"><button onclick="newQ()">＋ Câu hỏi</button>';d.questions.forEach(q=>{h+='<div class="qcard"><div class="qgrid"><div><label>Section</label><select id="qs'+q.QuestionId+'">'+d.sections.map(s=>'<option value="'+s.SectionId+'" '+(s.SectionId===q.SectionId?'selected':'')+'>'+E(s.Title)+'</option>').join('')+'</select></div><div><label>Câu hỏi</label><input id="ql'+q.QuestionId+'" value="'+E(q.Label)+'"></div><div><label>Loại</label><select id="qt'+q.QuestionId+'">'+A.types.map(t=>'<option '+(t===q.Type?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div><label>STT</label><input id="qo'+q.QuestionId+'" type="number" value="'+q.SortOrder+'"></div><div><label>Bắt buộc</label><input id="qr'+q.QuestionId+'" type="checkbox" '+(q.Required?'checked':'')+'></div></div><label>Field key</label><input id="qf'+q.QuestionId+'" value="'+E(q.FieldKey)+'"><label>Đáp án, mỗi dòng Value=Label</label><textarea id="qo2'+q.QuestionId+'">'+q.Options.map(o=>o.Value+'='+o.Label).join('\n')+'</textarea><button onclick="saveQ(\''+q.QuestionId+'\')">Lưu</button> <button class="danger" onclick="delQ(\''+q.QuestionId+'\')">Ẩn</button></div>'});h+='</div>';$('builder').innerHTML=h}function parseO(x){return x.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{let i=s.indexOf('=');return i<0?{Value:s,Label:s}:{Value:s.slice(0,i).trim(),Label:s.slice(i+1).trim()}})}function newQ(){openM('Thêm câu hỏi','<div class="grid"><select id="nqs">'+A.full.sections.map(s=>'<option value="'+s.SectionId+'">'+E(s.Title)+'</option>').join('')+'</select><input id="nqf" placeholder="field_key"><input id="nql" class="full" placeholder="Nội dung"><select id="nqt">'+A.types.map(t=>'<option>'+t+'</option>').join('')+'</select><input id="nqo" type="number" value="999"><label><input id="nqr" type="checkbox"> Bắt buộc</label><textarea id="nqo2" class="full" placeholder="Có=Có&#10;Không=Không"></textarea></div><button onclick="createQ()">Thêm</button>')}async function createQ(){let d=await api('adminSaveQuestion',{token:A.token,code:A.cur.Code,question:{SectionId:$('nqs').value,FieldKey:$('nqf').value,Label:$('nql').value,Type:$('nqt').value,SortOrder:+$('nqo').value,Required:$('nqr').checked,Options:parseO($('nqo2').value)}});if(d.ok){closeM();builder()}else alert(d.message)}async function saveQ(id){let d=await api('adminSaveQuestion',{token:A.token,code:A.cur.Code,question:{QuestionId:id,SectionId:$('qs'+id).value,FieldKey:$('qf'+id).value,Label:$('ql'+id).value,Type:$('qt'+id).value,SortOrder:+$('qo'+id).value,Required:$('qr'+id).checked,Options:parseO($('qo2'+id).value)}});if(d.ok)alert('Đã lưu');else alert(d.message)}async function delQ(id){let d=await api('adminDeleteQuestion',{token:A.token,questionId:id});if(d.ok)builder()}
async function logic(){let d=await api('adminGetSurvey',{token:A.token,code:A.cur.Code});A.full=d;let h='<div class="card"><button onclick="newRule()">＋ Thêm rule</button>'+d.rules.map(r=>'<div class="rule">'+E(r.SourceQuestionId)+' '+E(r.Operator)+' '+E(r.CompareValue)+' → '+E(r.Action)+' '+E(r.TargetQuestionId)+' <button class="danger" onclick="delRule(\''+r.RuleId+'\')">Xóa</button></div>').join('')+'</div>';$('logic').innerHTML=h}function newRule(){let q=A.full.questions;openM('Conditional Logic','<div class="grid"><select id="rs">'+q.map(x=>'<option value="'+x.QuestionId+'">'+E(x.Label)+'</option>').join('')+'</select><select id="ro"><option>equals</option><option>not_equals</option><option>contains</option><option>not_empty</option><option>empty</option></select><input id="rc" placeholder="Giá trị"><select id="ra"><option>show</option><option>hide</option></select><select id="rt">'+q.map(x=>'<option value="'+x.QuestionId+'">'+E(x.Label)+'</option>').join('')+'</select></div><button onclick="createRule()">Lưu</button>')}async function createRule(){let d=await api('adminSaveRule',{token:A.token,code:A.cur.Code,rule:{SourceQuestionId:$('rs').value,Operator:$('ro').value,CompareValue:$('rc').value,Action:$('ra').value,TargetQuestionId:$('rt').value}});if(d.ok){closeM();logic()}}async function delRule(id){let d=await api('adminDeleteRule',{token:A.token,ruleId:id});if(d.ok)logic()}
async function responses(){let d=await api('adminGetResponses',{token:A.token,code:A.cur.Code});$('responses').innerHTML='<div class="card"><div class="table"><table><tr><th>Mã NV</th><th>Họ tên</th><th>CCCD</th><th>Status</th><th></th></tr>'+d.rows.map(r=>'<tr><td>'+E(r.MaNV)+'</td><td>'+E(r.HoTen)+'</td><td>'+E(r.CCCD)+'</td><td>'+E(r.Status)+'</td><td><button onclick="detail(\''+r.ResponseId+'\')">Chi tiết</button></td></tr>').join('')+'</table></div></div>'}async function detail(id){let d=await api('adminGetResponseDetail',{token:A.token,responseId:id});if(!d.ok)return;openM('Chi tiết','<div class="card">'+E(d.response.HoTen)+' — '+E(d.response.MaNV)+' — '+E(d.response.Status)+'</div>'+d.questions.map(q=>'<div class="question"><b>'+E(q.Label)+'</b><div>'+E(Array.isArray(d.answers[q.QuestionId])?d.answers[q.QuestionId].join(', '):(d.answers[q.QuestionId]||''))+'</div></div>').join(''))}async function bank(){let d=await api('adminGetQuestionBank',{token:A.token});$('bank').innerHTML='<div class="card"><h3>Question Bank</h3><div class="table"><table><tr><th>Field</th><th>Câu hỏi</th><th>Loại</th><th>Tag</th></tr>'+d.rows.map(q=>'<tr><td>'+E(q.FieldKey)+'</td><td>'+E(q.Label)+'</td><td>'+E(q.Type)+'</td><td>'+E(q.BankTag)+'</td></tr>').join('')+'</table></div></div>'}function settings(){$('settings').innerHTML='<div class="card"><h3>Đổi mật khẩu</h3><label>Mật khẩu cũ</label><input id="op" type="password"><label>Mật khẩu mới</label><input id="np" type="password"><label>Xác nhận</label><input id="cp" type="password"><button onclick="pw()">Đổi mật khẩu</button><p id="pe" class="err"></p></div>'}async function pw(){let d=await api('adminChangePassword',{token:A.token,oldPassword:$('op').value,newPassword:$('np').value,confirmPassword:$('cp').value});if(d.ok)alert('Đã đổi mật khẩu');else $('pe').textContent=d.message}async function downloadCsv(){let d=await api('adminExportCsv',{token:A.token,code:A.cur.Code});if(!d.ok)return alert(d.message);let a=document.createElement('a');a.href='data:text/csv;base64,'+d.data;a.download=d.filename;a.click()}async function logoutAdmin(){await api('adminLogout',{token:A.token});localStorage.removeItem('rasoatAdminToken');location.reload()}function openM(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}boot();
</script></body></html>
