<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Danh sách cần rà soát</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
}

/* THANH NAV TABS MỚI */
.nav-tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px auto;
}

.nav-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 30px;
    background: #fff;
    color: #334155;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #e5e7eb;
    transition: .25s;
}

.nav-tab:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.12);
    color: #2563eb;
}

.nav-tab.active {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    border: none;
}

h2 {
    margin-top: 20px;
}

.search-box {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

input {
    padding: 10px 15px;
    width: 280px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background-color: #1e40af;
}

#summary {
    margin-top: 15px;
    font-weight: bold;
}

table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 95%;
    background: white;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
}

th {
    background: #4CAF50;
    color: white;
}

.name-row {
    background: #e8f5e9;
    font-weight: bold;
}

.error {
    color: red;
}
</style>
</head>

<body>

<!-- THANH TAB TRUY CẬP CÁC TRANG -->
<div class="nav-tabs">
    <a href="https://bangchamcong.pages.dev" target="_blank" class="nav-tab">📋 Chấm Công</a>
    <a href="https://noiquy.pages.dev" target="_blank" class="nav-tab">📜 Lỗi cơm</a>
    <a href="https://bhxh.pages.dev" target="_blank" class="nav-tab">🏥 BHXH</a>
    <a href="#" class="nav-tab active">🏥 Rà soát</a>
    <a href="https://antoan.pages.dev" target="_blank" class="nav-tab">🛡️ An Toàn</a>
</div>

<h2>🔎 Danh sách cần rà soát</h2>
<div style="margin-top:10px">
    <p>📱 Quét QR để tra cứu nhanh</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://rasoat.pages.dev/" alt="QR Code">
</div> 

<p>Nhập chính xác số CCCD để tra cứu</p>

<!-- KHU VỰC TÌM KIẾM CÓ NÚT -->
<div class="search-box">
    <input type="text" id="search" placeholder="Nhập số CCCD...">
    <button onclick="performSearch()">🔍 Tìm kiếm</button>
</div>

<div id="summary"></div>

<table id="result">
<thead>
<tr>
    <th>STT</th>
    <th>Số CCCD</th> 
    <th>Họ và Tên</th>     
    <th>Từ ngày</th>
    <th>Đến ngày</th>    
    <th>Số ngày</th>
    <th>Số tiền</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let data = [];

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6WsXe_dmeIM5QgLrCgiBc4JgHLUGkHMfhR-moVKKPMR16ufMPMia8OYex4n8C0TB-LlkYHf-VKcjb/pub?gid=0&single=true&output=csv";

// Load data từ Google Sheets
fetch(sheetURL)
.then(res => res.text())
.then(csv => {
    const parsed = Papa.parse(csv, {
        header: true,
        skipEmptyLines: true
    });

    data = parsed.data;
});

// Sự kiện bấm phím Enter khi đang gõ trong ô Input
document.getElementById('search').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        performSearch();
    }
});

// Hàm xử lý tìm kiếm
function performSearch() {
    let inputVal = document.getElementById('search').value.trim();

    if (!inputVal) {
        alert("Vui lòng nhập số CCCD!");
        document.querySelector("#result tbody").innerHTML = "";
        document.getElementById("summary").innerText = "";
        return;
    }

    // Lọc tìm kiếm
    let filtered = data.filter(d => {
        // Tự động quét các cột có tên liên quan đến CCCD/CMND
        let cccd = (d["Số CCCD"] || d["CCCD"] || d["Số CMND"] || d["CMND"] || "").toString().trim();
        return cccd === inputVal;
    });

    if (filtered.length === 0) {
        document.querySelector("#result tbody").innerHTML = `<tr><td colspan="7" style="color:red; font-weight:bold;">Không tìm thấy dữ liệu cho số CCCD: ${inputVal}</td></tr>`;
        document.getElementById("summary").innerText = "Tổng số ngày: 0";
        return;
    }

    // GROUP THEO NHÂN VIÊN
    let grouped = {};

    filtered.forEach(d => {
        let cccdVal = (d["Số CCCD"] || d["CCCD"] || d["Số CMND"] || d["CMND"] || "");
        let key = cccdVal + "_" + (d["Họ và Tên"] || "");

        if (!grouped[key]) {
            grouped[key] = [];
        }

        grouped[key].push(d);
    });

    let html = "";
    let total = 0;

    for (let key in grouped) {
        let rows = grouped[key];

        let sumNgayNhanVien = rows.reduce((sum, item) => {
            let ngay = parseFloat(item["Số ngày"]) || 0;
            return sum + ngay;
        }, 0);

        total += sumNgayNhanVien;

        let currentCCCD = rows[0]["Số CCCD"] || rows[0]["CCCD"] || rows[0]["Số CMND"] || rows[0]["CMND"] || "";

        // Dòng tiêu đề nhân viên
        html += `
        <tr class="name-row">
            <td colspan="7">${rows[0]["Họ và Tên"]} (CCCD: ${currentCCCD}) - Tổng ngày: ${sumNgayNhanVien}</td>
        </tr>
        `;

        rows.forEach(d => {
            html += `
            <tr>
                <td>${d["STT"] || ""}</td>
                <td>${currentCCCD}</td>
                <td>${d["Họ và Tên"] || ""}</td>                
                <td>${d["Từ ngày"] || ""}</td>                
                <td>${d["Đến ngày"] || ""}</td>
                <td>${d["Số ngày"] || ""}</td>
                <td class="error">${d["Số tiền"] || ""}</td>
            </tr>`;
        });
    }

    document.querySelector("#result tbody").innerHTML = html;
    document.getElementById("summary").innerText = "Tổng số ngày: " + total;
}

// Auto refresh 60s
setInterval(() => location.reload(), 60000);

</script>

</body>
</html>
